version: '3.8'

services:
  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: wireguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Moscow
      # VPS public IP or domain
      - SERVERURL=${WG_SERVER_URL:?Set WG_SERVER_URL in .env}
      - SERVERPORT=${WG_SERVER_PORT:-51820}
      # Comma-separated peer names (devices that connect directly via WG)
      - PEERS=${WG_PEERS:-phone,laptop}
      - PEERDNS=1.1.1.1,8.8.8.8
      - INTERNAL_SUBNET=10.13.13.0
      - ALLOWEDIPS=0.0.0.0/0
    volumes:
      - ./configs/wireguard:/config
      - /lib/modules:/lib/modules:ro
    ports:
      - ${WG_SERVER_PORT:-51820}:51820/udp
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
    restart: unless-stopped
    networks:
      vpn:
        ipv4_address: 172.20.0.2

  pptpd:
    build:
      context: .
      dockerfile: pptpd.dockerfile
    container_name: pptpd
    cap_add:
      - NET_ADMIN
    ports:
      - "1723:1723"
    environment:
      - PPTP_LOCAL_IP=192.168.10.1
      - PPTP_REMOTE_IP_RANGE=192.168.10.100-200
      - PPTP_USERNAME=${PPTP_USERNAME:?Set PPTP_USERNAME in .env}
      - PPTP_PASSWORD=${PPTP_PASSWORD:?Set PPTP_PASSWORD in .env}
      - PPTP_DNS1=1.1.1.1
      - PPTP_DNS2=8.8.8.8
    volumes:
      - ./configs/pptpd:/etc/ppp/custom
    sysctls:
      - net.ipv4.ip_forward=1
    restart: unless-stopped
    depends_on:
      - wireguard
    networks:
      vpn:
        ipv4_address: 172.20.0.3

  # Optional: route PPTP traffic through WireGuard tunnel on the host
  router:
    build:
      context: .
      dockerfile: router.dockerfile
    container_name: vpn-router
    cap_add:
      - NET_ADMIN
    network_mode: host
    privileged: true
    environment:
      - WG_INTERFACE=wg0
      - PPTP_SUBNET=192.168.10.0/24
      - WG_SUBNET=10.13.13.0/24
    volumes:
      - ./configs/wireguard:/etc/wireguard:ro
      - ./scripts:/scripts:ro
    restart: unless-stopped
    depends_on:
      - wireguard
      - pptpd

networks:
  vpn:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
